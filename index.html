/* ======================================================================
   DEV SOURCES — four sidebar pages (Dev-tool, APIs, Cloud-Enhancements,
   OnPrem-Enhancements) showing Objects / Object ID / Description /
   Version pulled from a private AL repo in the same GitHub org as your
   CI/CD-connected repo, but a different repo.

   Like Extension Management above, this can't run as a plain browser
   fetch: reading a PRIVATE repo needs a token, and a token able to read
   another org repo has no business sitting in browser JavaScript where
   anyone with dev tools open could lift it. So the actual reading runs
   server-side, in a GitHub Actions workflow in your CI/CD repo, using a
   PAT stored as a repo secret (AL_SOURCE_PAT) that never reaches this
   tab. The workflow commits the results as dev-tool-data.json in that
   same repo; the browser then just does a plain, unauthenticated fetch
   of that file via raw.githubusercontent.com — no token, no CORS issue,
   the same trick extmgmt-data.json already relies on above.
   ====================================================================== */
const DEV_SOURCES = {
  cloudenh:  { label:'HOXT Cloud Enhancements' },
  onpremenh: { label:'HOXT OnPrem Enhancements' },
  devtool:   { label:'HOXT Developers Tool' },
};
// HOXT Projects and HOXT Custom API keep their own hand-entered lists of
// projects/APIs and objects, so GitHub only feeds them release notes + the
// current version (no object scan) — hence "notes only".
const NOTES_ONLY_SOURCES = {
  projects: { label:'HOXT Projects' },
  apis:     { label:'HOXT Custom API' },
};
const SYNC_SOURCES = { // order = order shown in Settings > Dev-tool Sync
  projects:  NOTES_ONLY_SOURCES.projects,
  cloudenh:  DEV_SOURCES.cloudenh,
  onpremenh: DEV_SOURCES.onpremenh,
  apis:      NOTES_ONLY_SOURCES.apis,
  devtool:   DEV_SOURCES.devtool,
};
const DEVTOOL_DATA_PATH = 'dev-tool-data.json';
function devSourceDefaults(key){
  return { owner:'', repo:'', branch:'main', folder:'', objectMeta:{}, releaseNotes:[], ...(NOTES_ONLY_SOURCES[key]?{notesOnly:true}:{}) };
}
function devToolSyncSettings(){
  const dt = DB.settings.devToolSync || (DB.settings.devToolSync = { sources:{}, lastRunAt:null, lastRunStatus:'', lastRunError:'' });
  dt.sources = dt.sources || {};
  Object.keys(SYNC_SOURCES).forEach(k=>{ if(!dt.sources[k]) dt.sources[k] = devSourceDefaults(k); }); // also fills sources added after the data file was first saved
  return dt;
}
function repoUrlOf(cfg){ return cfg && cfg.owner && cfg.repo ? `https://github.com/${cfg.owner}/${cfg.repo}` : ''; }
// "https://github.com/org/repo/tree/branch/some/folder" -> its parts, so the repo link typed on the
// Projects / Custom API page can pre-fill the sync settings
function ghParseRepoUrl(url){
  const m = /github\.com\/([^\/\s]+)\/([^\/\s#?]+?)(?:\.git)?(?:\/tree\/([^\/\s]+)(?:\/(.*))?)?\/?$/i.exec((url||'').trim());
  return m ? { owner:m[1], repo:m[2], branch:m[3]||'main', folder:(m[4]||'').replace(/\/$/,'') } : null;
}
function autoNotesOf(key){
  const src = devToolSyncSettings().sources[key];
  return ((src&&src.autoNotes)||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function autoNoteHeadline(n){
  const c = n.commits||[];
  return c.length ? c[0].summary + (c.length>1 ? ` (+${c.length-1} more)` : '') : '';
}
function devToolDataRawUrl(){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo) return null;
  // Cache-busted, same reasoning as extMgmtDataRawUrl() — raw.githubusercontent.com
  // caches aggressively (~5 min), which would otherwise mask a just-triggered sync.
  return `https://raw.githubusercontent.com/${gh.owner}/${gh.repo}/${gh.branch||'main'}/${DEVTOOL_DATA_PATH}?t=${Date.now()}`;
}
// Reads dev-tool-data.json straight from the repo — no auth, which is why this
// works from the browser even though the AL source repos themselves are
// private. Returns true if data was found and merged in.
async function loadDevToolDataFromGithub(){
  const url = devToolDataRawUrl();
  if(!url) return false;
  const res = await fetch(url);
  if(res.status === 404) return false;
  if(!res.ok) throw new Error(`Could not read Dev-tool sync data from GitHub (HTTP ${res.status}).`);
  const data = await res.json();
  const local = devToolSyncSettings();
  Object.keys(SYNC_SOURCES).forEach(key=>{
    const remote = (data.sources||{})[key];
    if(!remote) return;
    // defaults first, then everything committed (objects, apps, autoNotes, ...). objectMeta / releaseNotes are
    // hand-entered and the sync script leaves them untouched, so whatever's committed is current.
    local.sources[key] = { ...devSourceDefaults(key), ...remote, branch: remote.branch||'main', objectMeta: remote.objectMeta||{}, releaseNotes: remote.releaseNotes||[] };
  });
  local.lastRunAt = data.lastRunAt||null;
  local.lastRunStatus = data.lastRunStatus||'';
  local.lastRunError = data.lastRunError||'';
  // HOXT Projects / HOXT Custom API: each project or API lives in its own
  // subfolder under the repo folder configured for that source (e.g.
  // "root"). Match each subfolder's objects to the project/API whose Name or
  // Code equals the folder name, and merge them in — non-destructively, so a
  // manually-added object that isn't in the repo (yet) is left alone.
  Object.keys(NOTES_ONLY_SOURCES).forEach(kind=> applyHoxtProjectSync(kind));
  return true;
}
function hoxtFolderName(cfg, appDir){
  const root = (cfg.folder||'').replace(/\/+$/,'');
  const rel = root && (appDir===root || appDir.startsWith(root+'/')) ? appDir.slice(root.length).replace(/^\/+/,'') : appDir;
  return rel.split('/').filter(Boolean).pop() || '';
}
function applyHoxtProjectSync(kind){
  const cfg = devToolSyncSettings().sources[kind];
  if(!cfg || !cfg.owner || !cfg.repo) return;
  const data = hoxtData(kind);
  const byFolder = {};
  (cfg.objects||[]).forEach(o=>{
    const folder = hoxtFolderName(cfg, o.appDir||'');
    if(!folder) return; // an app.json sitting directly in the scanned root isn't one of the named projects/APIs
    (byFolder[folder] = byFolder[folder] || []).push(o);
  });
  const appByFolder = {};
  (cfg.apps||[]).forEach(a=>{ const f = hoxtFolderName(cfg, a.path||''); if(f) appByFolder[f]=a; });
  const unmatched = [];
  let changed = false;
  Object.keys(byFolder).forEach(folder=>{
    const item = data.projects.find(p=> (p.name||'').trim().toLowerCase()===folder.toLowerCase() || (p.code||'').trim().toLowerCase()===folder.toLowerCase());
    if(!item){ unmatched.push(folder); return; }
    item.objects = item.objects || [];
    byFolder[folder].forEach(o=>{
      const existing = item.objects.find(x=>x.objectType===o.objectType && x.objectId===o.objectId);
      if(!existing){ item.objects.push({id:uid(), objectType:o.objectType, objectId:o.objectId, description:o.description||''}); changed=true; }
      else if(existing.description !== (o.description||'')){ existing.description = o.description||''; changed=true; }
    });
    item.objectCount = item.objects.length;
    const appVersion = (appByFolder[folder]||{}).version;
    if(appVersion && item.latestVersion !== appVersion){ item.latestVersion = appVersion; changed=true; }
  });
  data.repoUnmatchedFolders = unmatched; // shown as a hint on the page — not persisted, just for the current render
  if(changed) saveDB();
}
// Writes just the connection config (owner/repo/branch/folder per source) to
// dev-tool-data.json — re-reads first and keeps each source's version/objects/
// lastSyncedAt plus the top-level lastRunAt/Status/Error exactly as GitHub
// Actions last left them, so a config-only save from this tab can never
// clobber a sync result the workflow committed moments earlier. Serialized
// through devToolSaveChain, same reasoning as extMgmtSaveChain above.
let devToolSaveChain = Promise.resolve();
function saveDevToolSyncToGithub(commitMessage){
  const run = ()=> saveDevToolSyncToGithubImpl(commitMessage);
  const next = devToolSaveChain.then(run, run);
  devToolSaveChain = next.catch(()=>{});
  return next;
}
async function saveDevToolSyncToGithubImpl(commitMessage){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo || !ghToken()) throw new Error('Connect GitHub on the CI/CD tab first (owner, repo, token with Contents: Read & write).');
  const localSources = {...devToolSyncSettings().sources};
  let remoteData = null;
  try{ const loaded = await loadDevToolDataFromGithub(); if(loaded) remoteData = devToolSyncSettings(); }catch(e){ /* no remote copy yet, or unreachable — proceed with local-only data */ }
  const merged = { sources:{}, lastRunAt: remoteData?remoteData.lastRunAt:null, lastRunStatus: remoteData?remoteData.lastRunStatus:'', lastRunError: remoteData?remoteData.lastRunError:'' };
  Object.keys(SYNC_SOURCES).forEach(key=>{
    const remoteSrc = remoteData ? remoteData.sources[key] : null;
    const loc = localSources[key] || devSourceDefaults(key);
    merged.sources[key] = {
      // start from whatever GitHub Actions last wrote (version, objects, apps, autoNotes, ...) ...
      ...(remoteSrc||{}),
      // ... then local wins for what's edited on this tab: connection details, plus the hand-entered
      // Status/Definition/Remarks and release notes, so a save here never loses an in-progress edit
      owner: loc.owner, repo: loc.repo, branch: loc.branch||'main', folder: loc.folder||'',
      objectMeta: loc.objectMeta || (remoteSrc && remoteSrc.objectMeta) || {},
      releaseNotes: loc.releaseNotes || (remoteSrc && remoteSrc.releaseNotes) || [],
      ...(NOTES_ONLY_SOURCES[key] ? {notesOnly:true} : {}),
    };
  });
  DB.settings.devToolSync = merged;
  await githubPutFile(DEVTOOL_DATA_PATH, JSON.stringify(merged, null, 2), commitMessage || `Update Dev-tool sync config (${new Date().toISOString()})`);
}
async function dispatchDevToolSyncWorkflow(){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo || !ghToken()) throw new Error('Connect GitHub on the CI/CD tab first (owner, repo, token with Actions: Read & write) and push the sync automation.');
  const res = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/actions/workflows/dev-tool-sync.yml/dispatches`, {
    method:'POST',
    headers:{ 'Authorization':`Bearer ${ghToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify({ ref: gh.branch || 'main' }),
  });
  if(res.status !== 204){
    let body = null; try{ body = await res.json(); }catch(e){}
    let msg = (body && body.message) || `GitHub API error (HTTP ${res.status})`;
    if(/resource not accessible/i.test(msg)){
      msg = `${msg} — triggering a workflow run needs a separate "Actions: Read and write" permission on the token (Contents/Workflows alone don't cover it). Also confirm the token's repository access includes this repo, and that the workflow file has been pushed to the repo's default branch.`;
    }
    throw new Error(msg);
  }
}

function devToolSyncScriptJs(){
  return `/*
 * Dev-tool Object Sync — unattended runner for GitHub Actions.
 *
 * Reads Objects / Object ID / Description / Version out of PRIVATE AL
 * source repos (same GitHub org, different repos from this one) for four
 * sources — Dev-tool, APIs, Cloud-Enhancements, OnPrem-Enhancements —
 * and writes the results into dev-tool-data.json at this repo's root.
 *
 * Runs server-side so the AL_SOURCE_PAT secret below (which needs read
 * access to those other, private repos) never has to sit in browser
 * JavaScript. The app's browser tab only ever reads the *output* file,
 * dev-tool-data.json, via a plain unauthenticated fetch — it never talks
 * to the AL source repos directly.
 *
 * Required repo secret (Settings > Secrets and variables > Actions):
 *   AL_SOURCE_PAT   A GitHub PAT with Contents: Read-only, scoped to
 *                   the AL source repo(s) used by the sources below.
 *
 * dev-tool-data.json's "sources" object (owner/repo/branch/folder per
 * key) is edited from the app itself (Settings > Dev-tool Sync) and
 * committed here before this script ever runs — this script only fills
 * in version / objects / lastSyncedAt for each source, using whatever
 * owner/repo/branch/folder is already on record for it.
 */

const AL_SOURCE_PAT = process.env.AL_SOURCE_PAT;
const fs = require('fs');
const path = require('path');
const DATA_FILE = path.join(process.cwd(), 'dev-tool-data.json');

function fail(msg) {
  console.error(\`::error::\${msg}\`);
  process.exit(1);
}

async function ghApi(owner, repo, apiPath) {
  const res = await fetch(\`https://api.github.com/repos/\${owner}/\${repo}\${apiPath}\`, {
    headers: { 'Authorization': \`Bearer \${AL_SOURCE_PAT}\`, 'Accept': 'application/vnd.github+json' },
  });
  const body = await res.json().catch(()=>null);
  if (!res.ok) throw new Error((body && body.message) || \`GitHub API error (HTTP \${res.status})\`);
  return body;
}
function decodeB64Utf8(b64) { return Buffer.from(b64.replace(/\\n/g, ''), 'base64').toString('utf8'); }

const AL_OBJECT_RE = /^\\s*(table|tableextension|page|pageextension|pagecustomization|report|reportextension|codeunit|query|xmlport|enum|enumextension|permissionset|permissionsetextension|profile|controladdin|interface)\\s+(\\d+)\\s+"?([^"\\r\\n{]+?)"?\\s*(\\{|extends)/gim;
function parseAlObjects(text) {
  const out = []; let m; AL_OBJECT_RE.lastIndex = 0;
  while ((m = AL_OBJECT_RE.exec(text))) out.push({ type: m[1].toLowerCase(), id: Number(m[2]), name: m[3].trim() });
  return out;
}

function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

// One commit -> { summary, details, author, date }. Merge commits are dropped
// (a "Merge pull request" keeps its PR title, which git stores in the body).
function commitInfo(c) {
  var msg = ((c.commit && c.commit.message) || '').replace(/\\r/g, '');
  var lines = msg.split('\\n');
  var summary = (lines[0] || '').trim();
  var details = lines.slice(1).join('\\n').trim();
  if (/^Merge (branch|remote-tracking)/i.test(summary)) return null;
  if (/^Merge pull request/i.test(summary) && details) {
    var dl = details.split('\\n');
    summary = (dl[0] || '').trim();
    details = dl.slice(1).join('\\n').trim();
  }
  if (!summary) return null;
  var who = (c.commit && c.commit.author && c.commit.author.name) || '';
  var when = (c.commit && c.commit.committer && c.commit.committer.date) || (c.commit && c.commit.author && c.commit.author.date) || '';
  return { sha: c.sha, summary: summary.slice(0, 200), details: details.slice(0, 600), author: who, date: when };
}

// Release notes straight from git history. For each app: find the commits that
// touched its app.json (each one is a possible version bump), read the version
// out of app.json as it was at that commit, then hand every commit between one
// bump and the next to the version that bump introduced — so 0.0.0.1 and
// 0.0.0.2 each list exactly the changes deployed in them, with their commit
// messages. Commits after the latest bump are not released yet and are left out.
async function buildAutoNotes(cfg, apps) {
  var owner = cfg.owner, repo = cfg.repo, branch = cfg.branch || 'main';
  var cache = Object.assign({}, cfg.versionCache || {}); // commit sha -> version (commits never change, so this is safe to keep)
  var groups = [];
  for (var ai = 0; ai < apps.length; ai++) {
    var app = apps[ai];
    var jsonPath = app.dir ? app.dir + '/app.json' : 'app.json';
    var bumps = await ghApi(owner, repo, '/commits?sha=' + encodeURIComponent(branch) + '&path=' + encPath(jsonPath) + '&per_page=60');
    if (!Array.isArray(bumps) || !bumps.length) continue;
    var truncated = bumps.length >= 60; // more bumps exist than we fetched
    var oldestBump = bumps[bumps.length - 1].sha;
    var bumpShas = {};
    bumps.forEach(function (b) { bumpShas[b.sha] = true; });

    var history = [];
    for (var page = 1; page <= 5; page++) {
      var batch = await ghApi(owner, repo, '/commits?sha=' + encodeURIComponent(branch) + (app.dir ? '&path=' + encPath(app.dir) : '') + '&per_page=100&page=' + page);
      if (!Array.isArray(batch) || !batch.length) break;
      history = history.concat(batch);
      if (batch.length < 100) break;
    }
    if (truncated) {
      var cut = history.findIndex(function (c) { return c.sha === oldestBump; });
      if (cut >= 0) history = history.slice(0, cut + 1);
    }
    history.reverse(); // oldest first

    for (var i = 0; i < history.length; i++) {
      var hc = history[i];
      if (bumpShas[hc.sha] && cache[hc.sha] === undefined) {
        try {
          var f = await ghApi(owner, repo, '/contents/' + encPath(jsonPath) + '?ref=' + hc.sha);
          var j = JSON.parse(decodeB64Utf8(f.content).replace(/^\\uFEFF/, ''));
          cache[hc.sha] = j.version || '';
        } catch (_) { cache[hc.sha] = ''; }
      }
    }

    var pending = [];
    for (var k = 0; k < history.length; k++) {
      var c = history[k];
      var info = commitInfo(c);
      if (info) pending.push(info);
      if (bumpShas[c.sha] && cache[c.sha]) {
        if (!(truncated && c.sha === oldestBump)) { // that oldest group would be missing its earlier commits, so skip it
          groups.push({
            id: c.sha, version: cache[c.sha], appName: app.name || '',
            date: (info && info.date) || ((c.commit && c.commit.committer && c.commit.committer.date) || ''),
            commits: pending.slice().reverse().slice(0, 30), // newest first
          });
        }
        pending = [];
      }
    }
  }
  // the same app + version bumped twice (say a dependency edit) reads as one release
  var byKey = {}, order = [];
  groups.forEach(function (g) {
    var key = g.appName + '|' + g.version;
    if (!byKey[key]) { byKey[key] = g; order.push(key); }
    else {
      var ex = byKey[key];
      ex.commits = g.commits.concat(ex.commits).slice(0, 30);
      if (g.date > ex.date) { ex.date = g.date; ex.id = g.id; }
    }
  });
  var out = order.map(function (key) { return byKey[key]; });
  out.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  return { notes: out.slice(0, 20), cache: cache };
}

async function syncOneSource(key, cfg) {
  if (!cfg.owner || !cfg.repo) { console.log(\`[\${key}] not configured yet — skipping.\`); return cfg; }
  const tree = await ghApi(cfg.owner, cfg.repo, \`/git/trees/\${encodeURIComponent(cfg.branch || 'main')}?recursive=1\`);
  const scoped = (tree.tree || []).filter(e => e.type === 'blob' && (!cfg.folder || e.path === cfg.folder || e.path.startsWith(cfg.folder + '/')));
  const entries = scoped.filter(e => e.path.endsWith('.al') || /(^|\\/)app\\.json$/.test(e.path));
  const apps = []; // every app.json in scope: { dir, name, version }
  const alFiles = []; // { path, text }
  for (const e of entries) {
    const blob = await ghApi(cfg.owner, cfg.repo, \`/git/blobs/\${e.sha}\`);
    const text = decodeB64Utf8(blob.content).replace(/^\\uFEFF/, ''); // AL's app.json often starts with a BOM, which JSON.parse rejects
    if (e.path.endsWith('app.json')) {
      try {
        const j = JSON.parse(text);
        apps.push({ dir: e.path.includes('/') ? e.path.slice(0, e.path.lastIndexOf('/')) : '', name: j.name || '', version: j.version || '' });
      } catch (_) {}
    } else alFiles.push({ path: e.path, text });
  }
  // An object belongs to the app whose app.json is the nearest one above its file
  const appFor = p => {
    let best = null;
    for (const a of apps) {
      const inside = a.dir === '' || p === a.dir || p.startsWith(a.dir + '/');
      if (inside && (!best || a.dir.length > best.dir.length)) best = a;
    }
    return best;
  };
  const byKey = {};
  for (const f of alFiles) {
    const app = appFor(f.path);
    for (const o of parseAlObjects(f.text)) {
      byKey[\`\${o.type}:\${o.id}\`] = { objectType: o.type, objectId: o.id, description: o.name, appName: app ? app.name : '', appVersion: app ? app.version : '', appDir: app ? app.dir : '' };
    }
  }
  // Release notes from git history. Never fatal: if it fails, the previous notes stay and the reason is recorded.
  var autoNotes = cfg.autoNotes || [], versionCache = cfg.versionCache || {}, notesError = '';
  try {
    var built = await buildAutoNotes(cfg, apps);
    autoNotes = built.notes; versionCache = built.cache;
  } catch (err) {
    notesError = err.message;
    console.error('::warning::' + key + ' release notes failed: ' + err.message);
  }
  console.log('[' + key + '] ' + autoNotes.length + ' release(s) found in git history' + (notesError ? ' (' + notesError + ')' : ''));
  // The source's own "current version" = the app closest to the top of the scanned folder
  const depth = a => a.dir.split('/').filter(Boolean).length;
  const mainApp = apps.slice().sort((a, b) => depth(a) - depth(b))[0] || null;
  console.log(\`[\${key}] \${cfg.owner}/\${cfg.repo}@\${cfg.branch || 'main'} — \${Object.keys(byKey).length} object(s) in \${apps.length} app(s)\${mainApp && mainApp.version ? \`, version \${mainApp.version}\` : ''}\`);
  return {
    ...cfg, // keeps objectMeta / releaseNotes (entered in the app) and anything else this script doesn't know about
    owner: cfg.owner, repo: cfg.repo, branch: cfg.branch || 'main', folder: cfg.folder || '',
    version: (mainApp && mainApp.version) || cfg.version || null,
    apps: apps.map(a => ({ name: a.name, version: a.version, path: a.dir })),
    objects: Object.values(byKey),
    autoNotes: autoNotes, versionCache: versionCache, notesError: notesError,
    lastSyncedAt: new Date().toISOString(),
  };
}

async function main() {
  if (!AL_SOURCE_PAT) fail('Missing AL_SOURCE_PAT secret.');
  if (!fs.existsSync(DATA_FILE)) fail(\`\${DATA_FILE} not found — save the connection config from the app first (Settings > Dev-tool Sync > Save Connection).\`);
  const data = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
  data.sources = data.sources || {};
  let lastRunError = '';
  for (const key of Object.keys(data.sources)) {
    try {
      data.sources[key] = await syncOneSource(key, data.sources[key]);
    } catch (err) {
      lastRunError += \`[\${key}] \${err.message}\\n\`;
      console.error(\`::warning::\${key} sync failed: \${err.message}\`);
    }
  }
  data.lastRunAt = new Date().toISOString();
  data.lastRunStatus = lastRunError ? 'error' : 'success';
  data.lastRunError = lastRunError.trim();
  fs.writeFileSync(DATA_FILE, JSON.stringify(data, null, 2));
  if (lastRunError) fail(\`One or more sources failed:\\n\${lastRunError}\`);
}

main();
`;
}

function devToolSyncWorkflowYaml(){
  return `name: Dev-tool Object Sync

on:
  schedule:
    # Cron is UTC only and does not adjust for DST. 16:30 UTC = 12:30 AM
    # Philippine Time (UTC+8) — offset 30 min from the BC Extension Snapshot
    # job so the two don't start at the exact same minute. Edit directly in
    # GitHub if your target timezone changes.
    - cron: '30 16 * * *'
  workflow_dispatch: {}

# Without this, clicking "Run Sync Now" more than once (or a manual run
# landing mid-schedule) lets multiple runs execute at the same time, all
# racing to push dev-tool-data.json back to the repo — which is exactly
# what kept rejecting the push even with retries. Same group name as the
# BC Extension Snapshot workflow, on purpose: that workflow also commits
# to this same repo/branch, so without sharing the group the two could
# still collide with each other even though neither collides with
# itself anymore. Sharing the group queues them against each other too.
concurrency:
  group: bcovc-repo-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run Dev-tool sync
        env:
          AL_SOURCE_PAT: \${{ secrets.AL_SOURCE_PAT }}
        run: node scripts/run-dev-tool-sync.js

      - name: Commit updated sync data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tool-data.json 2>/dev/null || { echo "dev-tool-data.json not present — nothing to commit."; exit 0; }
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Dev-tool sync ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Something else (a manual re-run, or another workflow like the BC
          # Extension Snapshot) can land a commit on this branch between the
          # checkout above and this push. Retry with a rebase instead of
          # failing outright — this local commit only ever touches
          # dev-tool-data.json, so rebasing onto whatever else landed is safe.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase origin \${{ github.ref_name }}
            sleep $((RANDOM % 5 + 1))
          done
`;
}

const DEVOBJ_STATUS_OPTS = HOXT_STATUS_OPTS; // same Active / In Development / Pending Release / Obsolete / Deprecated set as the HOXT Projects pages
function devObjKey(objectType, objectId){ return `${objectType}:${objectId}`; }
// Hand-entered fields (Definition / Status / Remarks) live apart from the
// auto-read objects list, keyed by type:id, so a GitHub Actions re-sync (which
// only knows Type / ID / name) never wipes them — see the "...cfg" spread in
// syncOneSource(). Latest Version, Ticket Tag and Application Name are NOT
// stored: they're worked out fresh each time (below).
function devObjMeta(cfg, objectType, objectId){
  cfg.objectMeta = cfg.objectMeta || {};
  const k = devObjKey(objectType, objectId);
  return cfg.objectMeta[k] || (cfg.objectMeta[k] = { definition:'', status:'active', remarks:'', updatedAt:null });
}
const AL_TYPE_LABEL = {
  table:'Table', tableextension:'Table Extension', page:'Page', pageextension:'Page Extension', pagecustomization:'Page Customization',
  report:'Report', reportextension:'Report Extension', codeunit:'Codeunit', query:'Query', xmlport:'XMLport',
  enum:'Enum', enumextension:'Enum Extension', permissionset:'Permission Set', permissionsetextension:'Permission Set Extension',
  profile:'Profile', controladdin:'Control Add-in', interface:'Interface',
};
function devObjTypeLabel(t){ return AL_TYPE_LABEL[t] || cap(String(t||'')); }
// AL keyword (from the .al file) -> this app's Object Type code (Settings > Object
// Types). Matches the default codes; if those were renamed, ticket matching
// falls back to Object ID alone.
const AL_TYPE_TO_CODE_HINT = {
  table:'TAB', tableextension:'TBE', page:'PAG', pageextension:'PGE', pagecustomization:'PAG',
  report:'REP', reportextension:'RPE', codeunit:'COD', query:'QUE', xmlport:'XML',
  enum:'ENU', enumextension:'ENX', permissionset:'PST', permissionsetextension:'PST', interface:'INT',
};
// AL doesn't version individual objects, only the app they ship in. So an
// object's "latest version" is the version in the app.json of the app it
// lives in (per object, since one source can hold several apps), falling back
// to the source's own current version.
function devObjVersion(cfg, o){ return o.appVersion || cfg.version || null; }
// "Update as of": when someone last saved this object's details here; until
// then, the last time the repo was read.
function devObjUpdatedAt(cfg, meta){ return (meta && meta.updatedAt) || cfg.lastSyncedAt || null; }
function devFmtDate(iso){ return iso ? new Date(iso).toLocaleDateString() : '—'; }
// Tickets (from the Tickets module) that list this exact Object Type + ID.
function ticketsForDevObject(objectType, objectId){
  const hintCode = AL_TYPE_TO_CODE_HINT[objectType];
  const hintType = hintCode ? DB.settings.objectTypes.find(t=>t.code.toUpperCase()===hintCode) : null;
  return DB.tickets.filter(t => (t.objects||[]).some(o =>
    o.objectId === objectId && (hintType ? o.objectType === hintType.id : true)
  ));
}

/* ======================================================================
   EXTENSION MANAGEMENT COMPARISON
   Compares installed Business Central extensions across a Production
   environment and its sandboxes, via either a deployed custom AL API
   (per-company) or the BC Admin Center API.

   STORAGE — deliberately different from the rest of this app: everything
   else (Projects, Tickets, Store Customization, Users, general Settings)
   lives in the shared SharePoint database file. This feature's connection
   settings + rolling snapshot history instead live in the connected
   GitHub repo, as extmgmt-data.json (see EXTMGMT_DATA_PATH below) — see
   loadExtMgmtFromGithub() / saveExtMgmtToGithub(). flushSaveToSharePoint()
   explicitly excludes settings.extMgmt and extSnapshots so this data never
   gets duplicated back into SharePoint.

   SYNCING — a browser tab can never successfully call Microsoft's
   client-credentials token endpoint directly (no CORS support there by
   design), so "Run Sync Now" doesn't call Business Central itself; it
   triggers the pushed GitHub Actions workflow via dispatchExtSnapshotWorkflow(),
   which runs the equivalent logic server-side on GitHub, then commits the
   result straight into the repo (see the generated scripts/run-extension-
   snapshot.js and .github/workflows/bc-extension-snapshot.yml). The
   Client Secret field in this UI follows the same pattern as the GitHub
   PAT on the CI/CD tab: kept in this browser tab's sessionStorage only,
   never written anywhere — it's only ever needed as a copy-paste source
   for the repo's BC_CLIENT_SECRET Actions secret.
   ====================================================================== */
function bcSecretRemember(){ return localStorage.getItem('bcovc_bc_secret_remember') === '1'; }
function setBcSecretRemember(v){ if(v) localStorage.setItem('bcovc_bc_secret_remember','1'); else { localStorage.removeItem('bcovc_bc_secret_remember'); localStorage.removeItem('bcovc_bc_secret'); } }
function bcClientSecret(){ return sessionStorage.getItem('bcovc_bc_secret') || (bcSecretRemember() ? (localStorage.getItem('bcovc_bc_secret')||'') : ''); }
function setBcClientSecret(s){
  if(s){ sessionStorage.setItem('bcovc_bc_secret', s); if(bcSecretRemember()) localStorage.setItem('bcovc_bc_secret', s); }
  else { sessionStorage.removeItem('bcovc_bc_secret'); localStorage.removeItem('bcovc_bc_secret'); }
}
function extMgmtSettings(){
  return DB.settings.extMgmt || (DB.settings.extMgmt = {
    tenantId:'', clientId:'', environments:[], retentionDays:35, lastRunAt:null, lastRunStatus:'', lastRunError:'',
    apiMode:'custom', apiPublisher:'', apiGroup:'', apiVersion:'v2.0',
    basisEnvId:'', // env id used as the comparison baseline — checkbox on Settings > Extension Management; falls back to the env typed "Production"
    customStatuses:[], // admin-defined conditional statuses layered on top of the built-in ones — see settingsExtMgmt()
  });
}
const EXTMGMT_DATA_PATH = 'extmgmt-data.json';
function extMgmtDataRawUrl(){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo) return null;
  // Cache-busted — raw.githubusercontent.com caches aggressively (~5 min),
  // which would otherwise mask a just-triggered sync's results.
  return `https://raw.githubusercontent.com/${gh.owner}/${gh.repo}/${gh.branch||'main'}/${EXTMGMT_DATA_PATH}?t=${Date.now()}`;
}
// Reads extmgmt-data.json straight from the public repo (no auth needed —
// this is why it works from the browser at all, unlike SharePoint/BC).
// Returns true if data was found and merged in, false if the file doesn't
// exist yet (e.g. nothing has been saved from here before) — in that case
// whatever's already in memory (e.g. carried over from an older SharePoint
// copy, pre-migration) is left untouched rather than wiped.
async function loadExtMgmtFromGithub(){
  const url = extMgmtDataRawUrl();
  if(!url) return false;
  const res = await fetch(url);
  if(res.status === 404) return false;
  if(!res.ok) throw new Error(`Could not read Extension Management data from GitHub (HTTP ${res.status}).`);
  const data = await res.json();
  DB.settings.extMgmt = Object.assign(extMgmtSettings(), data.settings||{});
  DB.extSnapshots = data.snapshots||[];
  return true;
}
// Writes connection settings + current snapshots to extmgmt-data.json in
// the repo (via the GitHub Contents API, using the same PAT as CI/CD —
// Contents: Read & write is enough, nothing extra needed for this part).
//
// Re-reads the file immediately before writing and keeps its snapshots /
// lastRunAt / lastRunStatus / lastRunError as the source of truth — those
// fields are effectively "owned" by GitHub Actions, so a settings-only
// save from the browser (e.g. editing an environment) can never overwrite
// a snapshot the Action committed moments earlier. Only the fields the
// person actually edits here (tenantId, clientId, environments, apiMode,
// apiPublisher, apiGroup, apiVersion, retentionDays) take the local value.
//
// Calls are serialized through extMgmtSaveChain: several UI actions can
// each trigger a save in quick succession (e.g. clicking "Add Environment"
// kicks one off in the background, then "Save Environments" moments later
// starts another) — without serialization these would race each other's
// read-merge-write cycle and intermittently fail with a sha conflict, or
// silently overwrite one another. Chaining them ensures each save only
// starts once the previous one has fully finished.
let extMgmtSaveChain = Promise.resolve();
function saveExtMgmtToGithub(commitMessage){
  const run = ()=> saveExtMgmtToGithubImpl(commitMessage);
  const next = extMgmtSaveChain.then(run, run); // run regardless of the previous save's outcome
  extMgmtSaveChain = next.catch(()=>{}); // never let one failure poison the chain for later saves
  return next;
}
async function saveExtMgmtToGithubImpl(commitMessage){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo || !ghToken()) throw new Error('Connect GitHub on the CI/CD tab first (owner, repo, token with Contents: Read & write).');
  const local = {...extMgmtSettings()};
  let remoteSettings = {}, remoteSnapshots = [];
  try{
    const remote = await loadExtMgmtFromGithub();
    if(remote){ remoteSettings = extMgmtSettings(); remoteSnapshots = DB.extSnapshots||[]; }
  }catch(e){ /* no remote copy yet, or unreachable — proceed with local-only data */ }
  const merged = {
    ...remoteSettings,
    tenantId: local.tenantId, clientId: local.clientId, environments: local.environments,
    apiMode: local.apiMode, apiPublisher: local.apiPublisher, apiGroup: local.apiGroup,
    apiVersion: local.apiVersion, retentionDays: local.retentionDays,
    basisEnvId: local.basisEnvId, customStatuses: local.customStatuses,
  };
  DB.settings.extMgmt = merged;
  DB.extSnapshots = remoteSnapshots;
  const payload = { settings: merged, snapshots: remoteSnapshots };
  await githubPutFile(EXTMGMT_DATA_PATH, JSON.stringify(payload, null, 2), commitMessage || `Update Extension Management data (${new Date().toISOString()})`);
}
function prodEnv(){ return (extMgmtSettings().environments||[]).find(e=>e.type==='production') || null; }
// The environment used as the comparison baseline everywhere on the Extension
// Management Comparison page. Set via the "Basis" checkbox on Settings >
// Extension Management > Environments; falls back to whichever environment
// is typed Production if nothing's explicitly checked (keeps old data working).
function getBasisEnv(em){
  em = em || extMgmtSettings();
  const envs = em.environments||[];
  return envs.find(e=>e.id===em.basisEnvId) || envs.find(e=>e.type==='production') || null;
}
function latestSnapshot(){ return DB.extSnapshots.length ? DB.extSnapshots[DB.extSnapshots.length-1] : null; }
function envResult(snap, envId){ return snap ? (snap.results||[]).find(r=>r.envId===envId) || null : null; }
// One snapshot per calendar day (most recent capture that day), most recent N days.
// Defaults to the configured retention window; pass an explicit `days` (e.g. 30
// for the Monthly comparison) to cap it further without changing what's stored.
function snapshotsLastNDays(days){
  const retention = extMgmtSettings().retentionDays || 35;
  const n = Math.min(days || retention, retention);
  const byDay = {};
  DB.extSnapshots.forEach(s=>{ byDay[s.timestamp.slice(0,10)] = s; });
  return Object.keys(byDay).sort().slice(-n).map(d=>byDay[d]);
}
function diffExtensions(prodExts, envExts){
  const prodMap = new Map((prodExts||[]).map(e=>[e.name, e]));
  const envMap = new Map((envExts||[]).map(e=>[e.name, e]));
  const missing=[], versionMismatch=[], extra=[], matching=[];
  prodMap.forEach((pe,name)=>{
    const ee = envMap.get(name);
    if(!ee) missing.push(name);
    else if((ee.version||'') !== (pe.version||'')) versionMismatch.push(name);
    else matching.push(name);
  });
  envMap.forEach((ee,name)=>{ if(!prodMap.has(name)) extra.push(name); });
  return {missing, versionMismatch, extra, matching};
}
function pruneExtSnapshots(){
  const days = extMgmtSettings().retentionDays || 35;
  const cutoff = Date.now() - days*24*60*60*1000;
  DB.extSnapshots = DB.extSnapshots.filter(s=> new Date(s.timestamp).getTime() >= cutoff);
}
// Log Maintenance (Settings > General): clears activity log entries older
// than DB.settings.logRetentionDays. A retention of 0 means "keep forever" —
// nothing is pruned. Runs automatically after every new log entry, and can
// also be triggered on demand via "Clear Logs Now".
function pruneLogs(){
  const days = DB.settings.logRetentionDays || 0;
  if(!days) return;
  const cutoff = Date.now() - days*24*60*60*1000;
  DB.logs = (DB.logs||[]).filter(l=> new Date(l.timestamp).getTime() >= cutoff);
}
// Compares two dotted/segmented version strings numerically, segment by segment
// (e.g. "23.1.2.0" vs "23.10.0.0" — a plain string compare would get this wrong).
// Returns -1 / 0 / 1. Missing or non-numeric segments are treated as 0.
function compareVersions(a,b){
  if((a||'')===(b||'')) return 0;
  if(!a) return -1;
  if(!b) return 1;
  const pa = String(a).split(/[.\-+]/), pb = String(b).split(/[.\-+]/);
  const len = Math.max(pa.length, pb.length);
  for(let i=0;i<len;i++){
    const na = parseInt(pa[i],10), nb = parseInt(pb[i],10);
    const va = isNaN(na)?0:na, vb = isNaN(nb)?0:nb;
    if(va!==vb) return va<vb ? -1 : 1;
  }
  return 0;
}
// Builds, for one environment, a name -> {lastVersion, everPresent} map from every
// stored snapshot *before* the one passed as `snap` (i.e. everything except the
// "current" reading). Used to detect the two historical statuses: an extension
// that used to be there and now isn't (Removed Extension), and one whose version
// went backwards since a prior snapshot (Downgraded Version). Walking days in
// ascending order means the last write for a name is always its most recent
// prior state, so one pass is enough.
function buildEnvHistoryMap(envId, snap){
  const map = new Map();
  const byDay = {};
  DB.extSnapshots.forEach(s=>{ if(snap && s.id===snap.id) return; byDay[s.timestamp.slice(0,10)] = s; });
  Object.keys(byDay).sort().forEach(d=>{
    const r = envResult(byDay[d], envId);
    if(r && r.ok){
      (r.extensions||[]).forEach(ext=>{
        const cur = map.get(ext.name) || {lastVersion:null, everPresent:false};
        cur.everPresent = true;
        if(ext.version) cur.lastVersion = ext.version;
        map.set(ext.name, cur);
      });
    }
  });
  return map;
}
// Evaluates one admin-defined conditional status rule (Settings > Extension
// Management > Comparison Status Rules) against a single extension cell.
// Rules only ever match an *installed* extension's name or version — they
// layer extra labels on top of the built-in statuses, they don't invent
// installs that aren't there.
function matchesCustomRule(rule, ctx){
  if(!ctx.ext) return false;
  const field = rule.field==='name' ? (ctx.name||'') : (ctx.ext.version||'');
  const val = rule.value||'';
  switch(rule.operator){
    case 'equals': return field===val;
    case 'notEquals': return field!==val;
    case 'contains': return !!val && field.toLowerCase().includes(val.toLowerCase());
    case 'startsWith': return !!val && field.toLowerCase().startsWith(val.toLowerCase());
    case 'regex': try{ return new RegExp(val,'i').test(field); }catch(e){ return false; }
    default: return false;
  }
}
const CUSTOM_STATUS_COLORS = { success:'active', warning:'pending', danger:'danger', info:'drafting', neutral:'obsolete' };
// Determines the single status badge for one (extension, environment) cell,
// relative to the configured basis environment. Evaluation order: admin-defined
// custom rules first (first match wins), then the historical checks (Downgraded
// / Removed — these depend on this env's own snapshot history, not the basis),
// then the basis-relative checks (Missing, Not Updated, Latest Version).
function computeCellStatus(name, env, result, basisResult, basisEnv, em, histMap){
  const ext = result && result.ok ? (result.extensions||[]).find(x=>x.name===name) : null;
  const basisExt = basisResult && basisResult.ok ? (basisResult.extensions||[]).find(x=>x.name===name) : null;
  const isBasisEnv = !!(basisEnv && env.id===basisEnv.id);

  for(const rule of (em.customStatuses||[])){
    if(matchesCustomRule(rule, {name, ext})){
      return {key:'custom', label:rule.label||'Custom', cls:CUSTOM_STATUS_COLORS[rule.color]||'obsolete', detail:rule.label};
    }
  }

  const hist = histMap ? (histMap.get(name) || {lastVersion:null, everPresent:false}) : {lastVersion:null, everPresent:false};

  if(!ext){
    if(hist.everPresent) return {key:'removed', label:'Removed Extension', cls:'obsolete', detail:`Was installed (last seen version ${hist.lastVersion||'—'}), no longer present`};
    if(basisExt && !isBasisEnv) return {key:'missing', label:'Missing Extension', cls:'danger', detail:`Present in ${escapeHtml(basisEnv.label||basisEnv.name)} — not installed here`};
    return {key:'none', label:'—', cls:'obsolete', muted:true};
  }

  if(hist.lastVersion && ext.version && compareVersions(ext.version, hist.lastVersion) < 0){
    return {key:'downgraded', label:'Downgraded Version', cls:'danger', detail:`Was ${hist.lastVersion}, now ${ext.version}`};
  }

  if(isBasisEnv || !basisExt){
    return {key:'latest', label:'Latest Version', cls:'active', detail:ext.version||''};
  }
  if((ext.version||'')===(basisExt.version||'')){
    return {key:'latest', label:'Latest Version', cls:'active', detail:ext.version||''};
  }
  const cmp = compareVersions(ext.version, basisExt.version);
  if(cmp < 0) return {key:'outdated', label:'Not Updated', cls:'pending', detail:`Basis is on ${basisExt.version||'—'}`};
  return {key:'ahead', label:'Ahead of Basis', cls:'drafting', detail:`Basis is on ${basisExt.version||'—'}`};
}
// The timestamp of the most recent snapshot in which this environment was read
// successfully — shown as "as of <date>" under each environment's column header
// so it's clear the data isn't necessarily from the very latest snapshot (e.g.
// if that environment's own read failed on the last run).
function envLastUpdated(envId){
  for(let i=DB.extSnapshots.length-1;i>=0;i--){
    const r = envResult(DB.extSnapshots[i], envId);
    if(r && r.ok) return DB.extSnapshots[i].timestamp;
  }
  return null;
}
// Publisher for a given extension name — extensions are expected to report the
// same publisher in every environment, but reads the first non-empty value
// found across the supplied env results just in case one environment's copy
// is missing it.
function extPublisherForName(name, resultsByEnv, envs){
  for(const e of envs){
    const r = resultsByEnv[e.id];
    if(!r || !r.ok) continue;
    const ext = (r.extensions||[]).find(x=>x.name===name);
    if(ext && ext.publisher) return ext.publisher;
  }
  return '';
}
// Builds the full universe of extension names / publishers available across the
// given set of (env -> result) maps, for populating the Excel-style filter
// dropdowns. Accepts an array of {resultsByEnv, envs} "slices" so both the
// Current tab (one snapshot) and Monthly tab (many days) can share this.
function extFilterUniverse(slices){
  const names = new Set(), publishers = new Set();
  slices.forEach(({resultsByEnv, envs})=>{
    envs.forEach(e=>{
      const r = resultsByEnv[e.id];
      if(!r || !r.ok) return;
      (r.extensions||[]).forEach(x=>{ if(x.name) names.add(x.name); if(x.publisher) publishers.add(x.publisher); });
    });
  });
  return {
    names:[...names].sort((a,b)=>a.localeCompare(b)),
    publishers:[...publishers].sort((a,b)=>a.localeCompare(b)),
  };
}
// Filters a list of extension names down to what's allowed by the active
// name/publisher filters (state.extFilters). A null filter means "show all".
function applyExtFilters(names, publisherLookup){
  const f = state.extFilters;
  return names.filter(name=>{
    if(f.name && f.name.size && !f.name.has(name)) return false;
    if(f.publisher && f.publisher.size){
      const pub = publisherLookup(name) || '';
      if(!f.publisher.has(pub)) return false;
    }
    return true;
  });
}
// Renders one Excel-style filter dropdown (search box + select all/clear +
// checkbox list) anchored under a column header. `kind` is 'name' or
// 'publisher' and keys into state.extFilters.
function extFilterPanel(kind, options){
  const selected = state.extFilters[kind]; // null = all selected
  const q = (state.extFilterSearch||'').toLowerCase();
  const visible = q ? options.filter(o=>o.toLowerCase().includes(q)) : options;
  return `
  <div class="ext-filter-panel" data-extfilterpanel="${kind}">
    <input type="text" placeholder="Search..." id="extFilterSearch" value="${escapeAttr(state.extFilterSearch||'')}">
    <div class="ext-filter-actions">
      <a data-extfilterall="${kind}">Select all</a>
      <a data-extfilterclear="${kind}">Clear</a>
    </div>
    <div class="ext-filter-list">
      ${visible.length ? visible.map(o=>`
        <label><input type="checkbox" class="ext-filter-opt" data-extfilterkind="${kind}" value="${escapeAttr(o)}" ${(!selected || selected.has(o))?'checked':''}> ${escapeHtml(o)}</label>
      `).join('') : `<div class="ext-filter-empty">No matches.</div>`}
    </div>
    <div class="ext-filter-footer">
      <button class="btn btn-sm btn-primary" data-extfilterdone="${kind}" type="button">Done</button>
    </div>
  </div>`;
}
function extFilterButton(kind, options){
  const selected = state.extFilters[kind];
  const active = !!(selected && selected.size && selected.size < options.length);
  return `
  <span class="ext-th-cell" style="display:inline-block;">
    <button type="button" class="ext-filter-btn ${active?'active':''}" data-extfiltertoggle="${kind}" title="Filter">${icon('filter')}${active?'<span class="dot"></span>':''}</button>
    ${state.extFilterOpen===kind ? extFilterPanel(kind, options) : ''}
  </span>`;
}
/* ======================================================================
   GENERIC EXCEL-STYLE GRID FILTER + SORT
   Same funnel-button UI as the Extension Management Comparison grid above
   (extFilterButton/extFilterPanel), generalized so any table on the HOXT
   pages (Projects, Custom API, Cloud/OnPrem Enhancements, Developers Tool)
   can use it. A "column" is {key, label, get: row => rawValue}; gridId keeps
   each page's filter/sort state separate.
   ====================================================================== */
const gridUniverseCache = {}; // gridId -> {colKey: [uniqueValues]} — the FULL universe, cached at render time so "Select all" stays correct even while the panel's search box is narrowing what's shown
function gridFilterState(gridId){ return state.gridFilters[gridId] || (state.gridFilters[gridId] = {}); }
function gridSortState(gridId){ return state.gridSort[gridId] || (state.gridSort[gridId] = {col:null, dir:null}); }
function gridColumnUniverse(rows, columns){
  const out = {};
  columns.forEach(c=>{
    const vals = new Set();
    rows.forEach(r=>{ const v = String(c.get(r) ?? '').trim(); if(v) vals.add(v); });
    out[c.key] = [...vals].sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
  });
  return out;
}
function applyGridFilters(gridId, rows, columns){
  const f = gridFilterState(gridId);
  return rows.filter(r=> columns.every(c=>{
    const sel = f[c.key];
    if(!sel || !sel.size) return true; // no filter set (or emptied via "Select all") = show all
    return sel.has(String(c.get(r) ?? '').trim());
  }));
}
function applyGridSort(gridId, rows, columns){
  const s = gridSortState(gridId);
  const col = s.col && columns.find(c=>c.key===s.col);
  if(!col || !s.dir) return rows;
  return [...rows].sort((a,b)=>{
    const av = col.get(a), bv = col.get(b);
    const cmp = (typeof av==='number' && typeof bv==='number')
      ? av-bv
      : String(av ?? '').localeCompare(String(bv ?? ''), undefined, {numeric:true, sensitivity:'base'});
    return s.dir==='asc' ? cmp : -cmp;
  });
}
function gridFilterPanel(gridId, col){
  const sel = gridFilterState(gridId)[col.key];
  const q = (state.gridFilterSearch||'').toLowerCase();
  const options = (gridUniverseCache[gridId]||{})[col.key] || [];
  const visible = q ? options.filter(o=>o.toLowerCase().includes(q)) : options;
  const sort = gridSortState(gridId);
  const k = `${gridId}:${col.key}`;
  return `
  <div class="ext-filter-panel" data-gridfilterpanel="${k}">
    <div class="ext-filter-actions" style="margin-bottom:8px;">
      <a data-gridsort="${k}:asc" style="${sort.col===col.key&&sort.dir==='asc'?'font-weight:700;':''}">↑ Sort A–Z</a>
      <a data-gridsort="${k}:desc" style="${sort.col===col.key&&sort.dir==='desc'?'font-weight:700;':''}">↓ Sort Z–A</a>
    </div>
    <input type="text" placeholder="Search..." id="gridFilterSearch" value="${escapeAttr(state.gridFilterSearch||'')}">
    <div class="ext-filter-actions">
      <a data-gridfilterall="${k}">Select all</a>
      <a data-gridfilterclear="${k}">Clear</a>
    </div>
    <div class="ext-filter-list">
      ${visible.length ? visible.map(o=>`
        <label><input type="checkbox" class="grid-filter-opt" data-gridfilterkind="${k}" value="${escapeAttr(o)}" ${(!sel || sel.has(o))?'checked':''}> ${escapeHtml(o)}</label>
      `).join('') : `<div class="ext-filter-empty">No matches.</div>`}
    </div>
    <div class="ext-filter-footer">
      <button class="btn btn-sm btn-primary" data-gridfilterdone="${k}" type="button">Done</button>
    </div>
  </div>`;
}
// <th> content: the column label plus its funnel button (and, if open, the
// dropdown). Use as: <th>${gridHeaderCell(gridId, col)}</th>
function gridHeaderCell(gridId, col){
  const sel = gridFilterState(gridId)[col.key];
  const options = (gridUniverseCache[gridId]||{})[col.key] || [];
  const filterActive = !!(sel && sel.size && sel.size < options.length);
  const sort = gridSortState(gridId);
  const sortActive = sort.col===col.key;
  const k = `${gridId}:${col.key}`;
  const isOpen = state.gridFilterOpen === k;
  return `<span class="ext-th-inner">${escapeHtml(col.label)}
    <span class="ext-th-cell" style="display:inline-block;">
      <button type="button" class="ext-filter-btn ${(filterActive||sortActive)?'active':''}" data-gridfiltertoggle="${k}" title="Filter / Sort">${icon('filter')}${filterActive?'<span class="dot"></span>':''}</button>
      ${isOpen ? gridFilterPanel(gridId, col) : ''}
    </span>
  </span>`;
}
// Runs the filter+sort pipeline and remembers this render's column universe
// (for the "Select all" fix above). Call once per table per render.
function gridProcess(gridId, rows, columns){
  gridUniverseCache[gridId] = gridColumnUniverse(rows, columns);
  return applyGridSort(gridId, applyGridFilters(gridId, rows, columns), columns);
}

// bcGetToken/bcFetchExtensions/runExtensionSnapshot/scheduleExtensionSnapshot were removed —
// direct browser-to-BC calls can never succeed (CORS on the Microsoft identity
// platform token endpoint), so all syncing runs via dispatchExtSnapshotWorkflow()
// below, which triggers the equivalent logic on GitHub Actions instead.
async function dispatchExtSnapshotWorkflow(){
  const gh = ghSettings();
  if(!gh.owner || !gh.repo || !ghToken()) throw new Error('Connect GitHub on the CI/CD tab first (owner, repo, token with Actions: Read & write) and push the snapshot automation.');
  const res = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/actions/workflows/bc-extension-snapshot.yml/dispatches`, {
    method:'POST',
    headers:{ 'Authorization':`Bearer ${ghToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify({ ref: gh.branch || 'main' }),
  });
  if(res.status !== 204){
    let body = null; try{ body = await res.json(); }catch(e){}
    let msg = (body && body.message) || `GitHub API error (HTTP ${res.status})`;
    if(/resource not accessible/i.test(msg)){
      msg = `${msg} — triggering a workflow run needs a separate "Actions: Read and write" permission on the token (Contents/Workflows alone don't cover it). Also confirm the token's repository access includes this repo, and that the workflow file has been pushed to the repo's default branch.`;
    }
    throw new Error(msg);
  }
}

function extSnapshotScriptJs(){
  return `/*
 * BC Extension Snapshot — unattended runner for GitHub Actions.
 *
 * Runs the same logic as "Run Sync Now" inside the app (viewExtMgmt /
 * runExtensionSnapshot in index.html), but from GitHub's own servers on a
 * cron schedule, so it fires whether or not anyone has the app open.
 *
 * STORAGE: unlike the rest of this app (Projects, Tickets, Store
 * Customization, Users, general Settings — all in the shared SharePoint
 * database file), Extension Management Comparison data lives in THIS
 * REPO, in extmgmt-data.json at the repo root. That file holds both the
 * connection settings (tenant/client IDs, environments, company IDs,
 * retention) and the rolling window of snapshots.
 *
 * Because this workflow already has the repo checked out (actions/checkout),
 * it reads and writes extmgmt-data.json as a normal local file — no
 * Microsoft Graph calls, no SharePoint app registration, no extra secrets
 * beyond the Business Central ones below. The workflow step after this
 * script runs commits the updated file with git, using the automatic
 * GITHUB_TOKEN (requires \`permissions: contents: write\` in the workflow).
 *
 * Required repo secrets (Settings > Secrets and variables > Actions):
 *   BC_TENANT_ID       Azure AD tenant (directory) ID
 *   BC_CLIENT_ID       Azure AD app registration (client) ID — Business Central only
 *   BC_CLIENT_SECRET   Client secret value for that app registration
 *
 * That app registration needs Business Central API access — either:
 *   (a) Custom API mode (default): normal BC user permissions in each
 *       environment for the deployed AL extension's API (publisher/
 *       group/version and each environment's Company ID come from
 *       extmgmt-data.json itself), or
 *   (b) Admin Center API mode: BC Admin Center / Global Admin role,
 *       if settings.apiMode is set to "admin" in extmgmt-data.json
 */

const BC_TENANT_ID = process.env.BC_TENANT_ID;
const BC_CLIENT_ID = process.env.BC_CLIENT_ID;
const BC_CLIENT_SECRET = process.env.BC_CLIENT_SECRET;

const fs = require('fs');
const path = require('path');
const DATA_FILE = path.join(process.cwd(), 'extmgmt-data.json');

function fail(msg) {
  console.error(\`::error::\${msg}\`);
  process.exit(1);
}

async function getToken(tenantId, clientId, clientSecret, scope) {
  const res = await fetch(\`https://login.microsoftonline.com/\${encodeURIComponent(tenantId)}/oauth2/v2.0/token\`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'client_credentials',
      client_id: clientId,
      client_secret: clientSecret,
      scope,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || \`Token request failed (HTTP \${res.status}) for scope \${scope}\`);
  return data.access_token;
}

async function fetchBcExtensions(bcToken, env, settings) {
  let url;
  if (settings.apiMode === 'admin') {
    url = \`https://api.businesscentral.dynamics.com/admin/v2.18/applications/businesscentral/environments/\${encodeURIComponent(env.name)}/extensions\`;
  } else {
    if (!settings.apiPublisher || !settings.apiGroup) throw new Error('Missing API Publisher/Group in extmgmt-data.json for custom API mode.');
    if (!env.companyId) throw new Error('Missing Company ID for this environment (required for custom API mode).');
    url = \`https://api.businesscentral.dynamics.com/v2.0/\${encodeURIComponent(settings.tenantId)}/\${encodeURIComponent(env.name)}/api/\${encodeURIComponent(settings.apiPublisher)}/\${encodeURIComponent(settings.apiGroup)}/\${encodeURIComponent(settings.apiVersion || 'v2.0')}/companies(\${env.companyId})/installedExtensions\`;
  }
  const res = await fetch(url, {
    headers: { Authorization: \`Bearer \${bcToken}\` },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || \`HTTP \${res.status}\`);
  return (data.value || []).map((e) => ({
    id: e.id || e.appId || e.name,
    name: e.displayName || e.name || 'Unnamed extension',
    publisher: e.publisher || '',
    version: e.version || [e.versionMajor, e.versionMinor, e.versionBuild, e.versionRevision].filter((v) => v != null).join('.'),
    state: e.state || (e.installed === false ? 'not installed' : 'installed'),
  }));
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function loadData() {
  if (!fs.existsSync(DATA_FILE)) {
    fail('extmgmt-data.json not found in the repo yet — save the connection once from the app (Settings > Extension Management) so it can be created first.');
  }
  return JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
}

function saveData(data) {
  fs.writeFileSync(DATA_FILE, JSON.stringify(data, null, 2) + '\\n', 'utf8');
}

function pruneSnapshots(data) {
  const days = (data.settings && data.settings.retentionDays) || 35;
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  data.snapshots = (data.snapshots || []).filter((s) => new Date(s.timestamp).getTime() >= cutoff);
}

async function main() {
  if (!BC_TENANT_ID || !BC_CLIENT_ID || !BC_CLIENT_SECRET) {
    fail('Missing BC_TENANT_ID / BC_CLIENT_ID / BC_CLIENT_SECRET repo secrets.');
  }

  console.log('Reading extmgmt-data.json from the repo...');
  const data = loadData();
  data.settings = data.settings || {};
  data.snapshots = data.snapshots || [];

  const environments = (data.settings.environments || []).filter((e) => e.name);
  if (!environments.length) {
    fail('No environments configured. Add at least one environment in the app\\'s Settings > Extension Management page first.');
  }

  console.log('Requesting Business Central token...');
  const bcToken = await getToken(BC_TENANT_ID, BC_CLIENT_ID, BC_CLIENT_SECRET, 'https://api.businesscentral.dynamics.com/.default');

  const results = [];
  for (const env of environments) {
    console.log(\`Fetching extensions for \${env.label || env.name}...\`);
    try {
      const extensions = await fetchBcExtensions(bcToken, env, data.settings);
      results.push({ envId: env.id, envName: env.name, envLabel: env.label || env.name, envType: env.type, ok: true, extensions });
    } catch (e) {
      console.warn(\`  failed: \${e.message}\`);
      results.push({ envId: env.id, envName: env.name, envLabel: env.label || env.name, envType: env.type, ok: false, error: e.message, extensions: [] });
    }
  }

  const snapshot = { id: uid(), timestamp: new Date().toISOString(), results };
  data.snapshots.push(snapshot);
  pruneSnapshots(data);

  const anyFailed = results.some((r) => !r.ok);
  data.settings.lastRunAt = snapshot.timestamp;
  data.settings.lastRunStatus = anyFailed ? 'error' : 'success';
  data.settings.lastRunError = anyFailed
    ? results.filter((r) => !r.ok).map((r) => \`\${r.envLabel}: \${r.error}\`).join(' | ')
    : '';

  console.log('Writing extmgmt-data.json...');
  saveData(data);

  console.log(\`Captured \${results.filter((r) => r.ok).length}/\${results.length} environment(s).\`);
  console.log(anyFailed ? 'Done, with some environment errors — see settings.lastRunError.' : 'Done.');
  if (anyFailed) process.exitCode = 1; // marks the Action run visibly failed, without blocking the commit step that saves what did succeed
}

main().catch((e) => fail(e.message || String(e)));
`;
}
function extSnapshotWorkflowYaml(){
  return `name: BC Extension Snapshot

on:
  schedule:
    # Cron is UTC only and does not adjust for DST. 16:00 UTC = 12:00 AM
    # Philippine Time (UTC+8). Edit this line directly in GitHub if your
    # target timezone changes.
    - cron: '0 16 * * *'
  workflow_dispatch: {}

# Same group name as Dev-tool Object Sync's workflow, on purpose: both
# workflows commit to this same repo/branch, so without a shared group
# they can run at the same time and race each other's push — which is
# exactly what caused "! [rejected] ... (fetch first)" errors. Sharing
# the group makes GitHub run them one at a time, queued, never both at
# once, regardless of which one was triggered first.
concurrency:
  group: bcovc-repo-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run extension snapshot
        env:
          BC_TENANT_ID: \${{ secrets.BC_TENANT_ID }}
          BC_CLIENT_ID: \${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: \${{ secrets.BC_CLIENT_SECRET }}
        run: node scripts/run-extension-snapshot.js

      - name: Commit updated snapshot data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extmgmt-data.json 2>/dev/null || { echo "extmgmt-data.json not present — nothing to commit."; exit 0; }
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Extension snapshot ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase origin \${{ github.ref_name }}
            sleep $((RANDOM % 5 + 1))
          done
`;
}

async function pushExtSnapshotScriptToGithub(){
  ghStatus('Pushing snapshot script…');

    ${customChips}

// Shared "Installed Extensions" grid: Extension Name -> Publisher Name ->
// Basis -> other environments.
function extGridTable(snap, basis, em){
  if(!snap){
    return `<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-faint);">
      ${icon('extmgmt')}<p style="margin-top:10px;font-size:13px;">No snapshot captured yet.</p>
    </div>`;
  }
  const envs = em.environments||[];
  const ordered = [...envs.filter(e=>e.type==='production'), ...envs.filter(e=>e.type!=='production')];
  const otherEnvs = ordered.filter(e=>!basis || e.id!==basis.id);
  const resultsByEnv = {}, histByEnv = {};
  ordered.forEach(e=>{ resultsByEnv[e.id] = envResult(snap, e.id); histByEnv[e.id] = buildEnvHistoryMap(e.id, snap); });
  const basisResult = basis ? resultsByEnv[basis.id] : null;
  const allNames = new Set();
  ordered.forEach(e=>{ const r = resultsByEnv[e.id]; if(r && r.ok) (r.extensions||[]).forEach(x=>allNames.add(x.name)); });
  const publisherFor = name => extPublisherForName(name, resultsByEnv, ordered);
  const universe = extFilterUniverse([{resultsByEnv, envs:ordered}]);
  const names = applyExtFilters([...allNames].sort((a,b)=>a.localeCompare(b)), publisherFor);
  const colCount = (basis?1:0) + 2 + otherEnvs.length;
  const envHeader = e => `<th>
      <span class="ext-th-inner">${escapeHtml(e.label||e.name)}
        ${e.type==='production'?`<span class="badge active" style="margin-left:2px;">Prod</span>`:`<span class="badge drafting" style="margin-left:2px;">Sandbox</span>`}
        ${resultsByEnv[e.id]&&!resultsByEnv[e.id].ok?`<span class="badge danger" style="margin-left:2px;">sync error</span>`:''}
      </span>
      <span class="ext-th-sub">as of ${envLastUpdated(e.id)?timeAgo(envLastUpdated(e.id)):'—'}</span>
    </th>`;
  return `
  <div class="table-wrap table-wrap-fixed">
  <table>
    <thead><tr>
      <th class="ext-sticky-col"><span class="ext-th-inner">Extension Name ${extFilterButton('name', universe.names)}</span></th>
      <th><span class="ext-th-inner">Publisher Name ${extFilterButton('publisher', universe.publishers)}</span></th>
      ${basis?`<th>
        <span class="ext-th-inner">${escapeHtml(basis.label||basis.name)} <span class="badge pending" style="margin-left:2px;">Basis</span></span>
        <span class="ext-th-sub">as of ${envLastUpdated(basis.id)?timeAgo(envLastUpdated(basis.id)):'—'}</span>
      </th>`:''}
      ${otherEnvs.map(envHeader).join('')}
    </tr></thead>
    <tbody>
    ${names.length ? names.map(name=>{
      const pub = publisherFor(name) || '—';
      const basisExt = basisResult && basisResult.ok ? (basisResult.extensions||[]).find(x=>x.name===name) : null;
      const basisTd = basis ? `<td>${basisExt
          ? `<span class="badge active" title="${escapeAttr(basisExt.version||'')}">${escapeHtml(basisExt.version||'—')}</span>`
          : `<span class="badge obsolete">Not in Basis</span>`}</td>` : '';
      const nameTd = `<td class="ext-sticky-col" style="font-weight:600;">${escapeHtml(name)}</td>`;
      return `<tr>
        ${nameTd}
        <td>${escapeHtml(pub)}</td>
        ${basisTd}
        ${otherEnvs.map(e=>{
          const r = resultsByEnv[e.id];
          if(!r || !r.ok) return `<td style="color:var(--text-faint);">—</td>`;
          const st = computeCellStatus(name, e, r, basisResult, basis, em, histByEnv[e.id]);
          if(st.key==='none') return `<td style="color:var(--text-faint);">—</td>`;
          const ext = (r.extensions||[]).find(x=>x.name===name);
          const versionTxt = ext&&ext.version ? escapeHtml(ext.version) : '';
          return `<td><span class="badge ${st.cls}" title="${escapeAttr(st.detail||st.label)}">${versionTxt?`${versionTxt} — `:''}${escapeHtml(st.label)}</span></td>`;
        }).join('')}
      </tr>`;
    }).join('') : `<tr><td colspan="${colCount}" style="color:var(--text-faint);text-align:center;padding:24px;">${allNames.size?'No matches.':'No extensions in this snapshot.'}</td></tr>`}
    </tbody>
  </table>
  </div>`;
}
function extComparisonCurrent(snap, basis, em){
  if(!snap){
    return `<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-faint);">
      ${icon('extmgmt')}<p style="margin-top:10px;font-size:13px;">No snapshot captured yet.</p>
    </div>`;
  }
  return `
  <div class="card" style="padding:0;">
    <div class="section-title" style="padding:20px 20px 4px;"><h3>${icon('layers')} Current Installed Extensions</h3><span class="hint">${timeAgo(snap.timestamp)}</span></div>
    ${extGridTable(snap, basis, em)}
  </div>
  ${extStatusLegend(em)}`;
}
function extComparisonMonthToDate(basis, em){
  const days = snapshotsLastNDays(30);
  if(!days.length){
    return `<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-faint);">
      ${icon('history')}<p style="margin-top:10px;font-size:13px;">No history yet.</p>
    </div>`;
  }
  const envs = em.environments||[];
  if(!state.extMonthlyEnvId || !envs.some(e=>e.id===state.extMonthlyEnvId)){
    const fallback = envs.find(e=>!basis || e.id!==basis.id) || envs[0] || null;
    state.extMonthlyEnvId = fallback ? fallback.id : '';
  }
  const env = envs.find(e=>e.id===state.extMonthlyEnvId) || null;

  const allNames = new Set();
  const publisherByName = {};
  if(env) days.forEach(s=>{
    const r = envResult(s, env.id);
    if(r && r.ok) (r.extensions||[]).forEach(x=>{ allNames.add(x.name); if(x.publisher && !publisherByName[x.name]) publisherByName[x.name] = x.publisher; });
  });
  const names = [...allNames].sort((a,b)=>a.localeCompare(b));
  const colCount = 2 + days.length;

  // Reverse days for display (latest first)
  const reversedDays = days.slice().reverse();

  return `
  <div class="card" style="padding:0;">

function extComparisonToDate(basis, em){
  const days = snapshotsLastNDays(Math.min(em.retentionDays||35, 90));
  if(!days.length){
    return `<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-faint);">
      ${icon('history')}<p style="margin-top:10px;font-size:13px;">No history yet.</p>
    </div>`;
  }
  if(!state.extMonthlyDay || !days.some(s=>s.timestamp.slice(0,10)===state.extMonthlyDay)){
    state.extMonthlyDay = days[days.length-1].timestamp.slice(0,10);
  }
  const selectedSnap = days.find(s=>s.timestamp.slice(0,10)===state.extMonthlyDay) || null;
  // Reverse days for display (latest first)
  const reversedDays = days.slice().reverse();
  return `
  <div class="card" style="padding:0;">
    <div class="section-title" style="padding:20px 20px 4px;flex-wrap:wrap;gap:10px;">
      <h3>${icon('layers')} To-Date Installed Extensions</h3>
      <div style="margin-left:auto;">
        <select id="extMonthlyDaySelect" style="min-width:150px;">
          ${reversedDays.map(s=>{ const d=s.timestamp.slice(0,10); return `<option value="${d}" ${d===state.extMonthlyDay?'selected':''}>${new Date(s.timestamp).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</option>`; }).join('')}
        </select>
      </div>
    </div>
    ${extGridTable(selectedSnap, basis, em, reversedDays)}
  </div>
  ${extStatusLegend(em)}`;
}

  state.modal = true;

  wrap.className='modal-overlay';

}

        </div>` : `
        <div class="form-row">
          <label>Repository </label>
          <div class="readonly-field">${(kind==='ticket'?DB.settings.ticketRepoUrl:DB.settings.storecustRepoUrl) ? `<a href="${escapeAttr(kind==='ticket'?DB.settings.ticketRepoUrl:DB.settings.storecustRepoUrl)}" target="_blank" rel="noopener">${escapeHtml(kind==='ticket'?DB.settings.ticketRepoUrl:DB.settings.storecustRepoUrl)}</a>` : `<span class="hint">Not set yet</span>`}</div>

          <h3 style="font-size:13.5px;">Version</h3>
        </div>
        ${kind==='project' ? `
        <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">

        </div>` : `
        <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">
          <div class="form-row"><div class="readonly-field mono" style="text-align:center;">${identity.y}</div></div>
          <div class="form-row"><div class="readonly-field mono" style="text-align:center;">${identity.m}</div></div>
          <div class="form-row"><div class="readonly-field mono" style="text-align:center;">${pad2(identity.num)}</div></div>

        <div class="form-row" style="margin-top:-4px;">
